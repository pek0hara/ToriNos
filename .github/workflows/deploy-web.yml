# GitHub Pages へ、サポートページ・プライバシーポリシー（リポジトリ直下）と Web 版（Kotlin/Wasm）を公開する。
# サポートページ等は従来と同じ URL（/ToriNos/、/ToriNos/privacy-policy.html）、Web 版は /ToriNos/app/ に置く。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp index.html privacy-policy.html styles.css .nojekyll _site/
          cp -R composeApp/build/dist/wasmJs/productionExecutable/. _site/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
